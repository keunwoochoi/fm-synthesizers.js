<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- family recipe (shared with physical-instruments.js): same dark plate,
       one bracketed glyph per synth family, one metallic finish per family.
       FM = [FM] in brushed violet -->
  <defs>
    <linearGradient id="violet" gradientUnits="userSpaceOnUse" x1="0" y1="12" x2="0" y2="52">
      <stop offset="0" stop-color="#eadcff"/>
      <stop offset=".45" stop-color="#b892f0"/>
      <stop offset=".78" stop-color="#7a4fc4"/>
      <stop offset="1" stop-color="#c3a4f5"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="#141120"/>
  <g stroke="url(#violet)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M17 15 H11 V49 H17" stroke-width="5.5"/>
    <path d="M53 15 H47 V49 H53" stroke-width="5.5"/>
    <path d="M22 15 V49" stroke-width="5.5"/>
    <path d="M22 24 H33" stroke-width="5.5"/>
    <path d="M22 32 H33" stroke-width="5.5"/>
    <path d="M22 40 H31" stroke-width="5.5"/>
  </g>
</svg>
